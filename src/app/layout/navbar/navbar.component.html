<header class="navbar" [class.overlay]="overlay">
  <a class="brand-link" routerLink="/" aria-label="Ir a inicio" (click)="closeMenu()">
    <img class="icon" src="/Images/responsive/logo-480.webp" alt="Logo Crystal Alquiladora" width="480" height="151" decoding="async" />
  </a>

  <button
    class="menu-toggle"
    [class.open]="menuOpen"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-controls="main-nav"
    aria-label="Abrir o cerrar menu"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="main-nav" class="menu" [class.open]="menuOpen" aria-label="Navegación principal">
    <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Inicio</a>
    <a routerLink="/catalogo" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Catálogo</a>
    <a routerLink="/servicios" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Servicios</a>
    <a routerLink="/nosotros" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Nosotros</a>
    <a routerLink="/contacto" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Contacto</a>
    <a class="request-link" routerLink="/solicitud" (click)="closeMenu()" [attr.aria-label]="'Mi solicitud, ' + quote.count() + ' conceptos'">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5h12v12H2zM14 9h4l4 4v4h-8"/><circle cx="6" cy="18" r="2" fill="currentColor"/><circle cx="18" cy="18" r="2" fill="currentColor"/></svg>
      Mi solicitud <span class="request-count">{{ quote.count() }}</span>
    </a>
  </nav>
</header>

@if (quote.count()) {
  <a routerLink="/solicitud" class="mobile-request" [attr.aria-label]="'Ver mi solicitud, ' + quote.count() + ' conceptos'">
    <span class="mobile-request__icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5h12v12H2zM14 9h4l4 4v4h-8"/><circle cx="6" cy="18" r="2" fill="currentColor"/><circle cx="18" cy="18" r="2" fill="currentColor"/></svg>
      <span class="mobile-request__count">{{ quote.count() }}</span>
    </span>
    <span class="mobile-request__text">
      <strong>Ver mi solicitud</strong>
      <span>Revisar equipo</span>
    </span>
    <svg class="mobile-request__arrow" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg>
  </a>
}
<p class="selection-announcement" role="status">{{ quote.announcement() }}</p>
