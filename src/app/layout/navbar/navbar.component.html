<header class="navbar" [class.overlay]="overlay">
  <a class="brand-link" routerLink="/" aria-label="Ir a inicio" (click)="closeMenu()">
    <img class="icon" src="/Images/responsive/logo-480.webp" alt="Logo Crystal Alquiladora" width="480" height="151" decoding="async" />
  </a>

  <button
    class="menu-toggle"
    [class.open]="menuOpen"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-controls="main-nav"
    aria-label="Abrir o cerrar menu"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="main-nav" class="menu" [class.open]="menuOpen" aria-label="Navegación principal">
    <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Inicio</a>
    <a routerLink="/catalogo" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Catálogo</a>
    <a routerLink="/servicios" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Servicios</a>
    <a routerLink="/nosotros" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Nosotros</a>
    <a routerLink="/contacto" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Contacto</a>
  </nav>
</header>
