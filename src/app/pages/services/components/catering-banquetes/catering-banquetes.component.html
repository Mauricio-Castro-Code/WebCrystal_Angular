<section class="catering-banquetes" aria-labelledby="catering-banquetes-title">
  <div class="catering-banquetes__shell">
    <div class="catering-banquetes__grid">
      <div class="catering-banquetes__content">
        <p class="catering-banquetes__eyebrow">Gastronomia</p>
        <h2 id="catering-banquetes-title">Catering y Banquetes</h2>

        <div class="catering-banquetes__features">
          @for (feature of features; track feature.title) {
            <article class="feature-card">
              <div class="feature-card__icon" aria-hidden="true">
                @switch (feature.icon) {
                  @case ('banquete') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                      <path d="M3 2v7c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2V2"/>
                      <path d="M7 2v20"/>
                      <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
                    </svg>
                  }
                  @case ('catering') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                      <path d="M12 4a1 1 0 0 0-1 1v6.5a1 1 0 0 0 1 1h0a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1Z"/>
                      <path d="M4.5 18h15"/>
                      <path d="M19.5 18a7.5 7.5 0 0 0-15 0"/>
                      <path d="M2 21h20"/>
                    </svg>
                  }
                }
              </div>
              <div class="feature-card__content">
                <h3>{{ feature.title }}</h3>
                <p>{{ feature.description }}</p>
              </div>
            </article>
          }
        </div>

      </div>

      <figure class="catering-banquetes__media">
        <img
          src="/Images/Catering.webp"
          alt="Montaje de banquete con vajilla premium"
          loading="lazy"
          decoding="async"
          fetchpriority="low"
          width="1670"
          height="2192"
        />
      </figure>
    </div>
  </div>
</section>
