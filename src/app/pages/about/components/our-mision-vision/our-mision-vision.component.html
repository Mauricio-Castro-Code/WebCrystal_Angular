<section class="our-mision-vision" aria-labelledby="our-mision-vision-title">
  <div class="our-mision-vision__shell">
    <header class="our-mision-vision__header">
      <h2 id="our-mision-vision-title">Mision y Vision</h2>
      <span class="our-mision-vision__accent" aria-hidden="true"></span>
    </header>

    <div class="our-mision-vision__grid">
      @for (card of cards; track card.title) {
        <article class="statement-card">
          <div class="statement-card__icon" aria-hidden="true">
            @switch (card.icon) {
              @case ('mision') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <circle cx="12" cy="12" r="10"/>
                  <circle cx="12" cy="12" r="6"/>
                  <circle cx="12" cy="12" r="2"/>
                </svg>
              }
              @case ('vision') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              }
            }
          </div>

          <h3>{{ card.title }}</h3>
          <p>{{ card.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
