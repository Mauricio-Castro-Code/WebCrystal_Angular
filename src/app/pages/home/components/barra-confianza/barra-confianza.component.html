<section class="trust-bar" aria-label="Barra de confianza">
  <div class="trust-bar__container">
    <div class="trust-bar__grid">
      @for (item of trustItems; track item.label) {
        <article class="trust-item">
          <div class="trust-item__icon-wrap" aria-hidden="true">
            @switch (item.icon) {
              @case ('experiencia') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <circle cx="12" cy="8" r="6"/>
                  <path d="m15.477 12.89 1.414 7.071L12 17.428 7.109 19.96l1.414-7.071"/>
                  <path d="m9 8 2 2 4-4"/>
                </svg>
              }
              @case ('soporte') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <path d="M3 11h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H3a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1Z"/>
                  <path d="M21 11h-1a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1Z"/>
                  <path d="M2 12a10 10 0 0 1 20 0"/>
                  <path d="M8 21h4a2 2 0 0 0 2-2v-1"/>
                </svg>
              }
              @case ('calidad') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <path d="M12 2 L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 Z"/>
                </svg>
              }
            }
          </div>
          <p class="trust-item__value">{{ item.value }}</p>
          <p class="trust-item__label">{{ item.label }}</p>
        </article>
      }
    </div>
  </div>
</section>
